# Automatización del pipeline.
#
# Sobre la cadencia: la guía pedía ejecución "en tiempo real". GitHub Actions
# solo ofrece cron, con un mínimo de 5 minutos y retrasos rutinarios de 5 a 15
# en la práctica, porque los trabajos programados tienen la prioridad más baja
# de la cola. Un cron de 5 minutos no da 5 minutos de latencia: da latencia
# impredecible y 288 ejecuciones diarias casi todas vacías.
#
# El dato que decide es que el portal publica en horario de oficina: el 86% de
# las entradas aparece entre las 09:00 y las 15:00 hora canaria, con el máximo
# a las 13:00. Fuera de esa franja, casi ninguna ejecución encuentra nada.
#
# NOTA: las expresiones cron de GitHub Actions van en UTC. Canarias es UTC+1 en
# horario de verano, así que la franja 08:00-20:00 local se expresa como 07-19.

name: Extracción transparencia-gobcan

on:
  schedule:
    - cron: "*/30 7-19 * * 1-5"   # cada 30 min en franja laboral (hora canaria)
    - cron: "0 21 * * *"          # cierre diario a las 22:00 hora canaria
  workflow_dispatch:              # ejecución manual desde la interfaz de GitHub
    inputs:
      modo:
        description: "Modo de ejecución"
        type: choice
        options: [incremental, historico]
        default: incremental
      notificar:
        description: "Enviar el aviso por correo"
        type: boolean
        default: true
      parlamento:
        description: "Recorrer también el Parlamento (tarda ~50 min)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Evita que dos ejecuciones solapadas compitan por el mismo UPSERT.
  group: extraccion-gobcan
  cancel-in-progress: false

jobs:
  extraer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        # El extra `respaldo` (Playwright) no se instala: la fuente principal es
        # una API REST y no hace falta navegador en la ejecución normal.
        run: pip install -e .

      - name: Comprobar la configuración antes de tocar datos
        run: transparencia validar-config

      - name: Comprobar que las credenciales llegan a la base
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: transparencia probar-conexion

      - name: Extraer del Gobierno de Canarias
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ENTORNO: produccion
        run: transparencia extraer --fuente gobcan --modo "${{ inputs.modo || 'incremental' }}"

      # El aviso va en un paso propio y después de la carga: si la extracción
      # falla no queremos mandar un correo a medias, y si falla el envío
      # queremos que los datos ya estén guardados de todos modos.
      - name: Regenerar el volcado que consume la interfaz
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: transparencia exportar

      # Sin esto el paso anterior no servía de nada: generaba el volcado en el
      # runner y se perdía al terminar el job. Como artefacto queda descargable
      # desde la pestaña Actions, así que cualquiera del equipo puede llevarse
      # los datos frescos a la interfaz sin tener credenciales de la base.
      - name: Guardar el volcado como artefacto
        uses: actions/upload-artifact@v7
        with:
          name: datos-interfaz
          path: visualizacion/datos.js
          retention-days: 14
          compression-level: 9

      - name: Enviar el aviso de decisiones detectadas
        if: ${{ inputs.notificar != false }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: "587"
          SMTP_USUARIO: ${{ secrets.SMTP_USUARIO }}
          SMTP_CONTRASENA: ${{ secrets.SMTP_CONTRASENA }}
          ALERTAS_REMITENTE: ${{ secrets.SMTP_USUARIO }}
          ALERTAS_DESTINATARIAS: ${{ vars.ALERTAS_DESTINATARIAS }}
          ALERTAS_DESDE: ${{ vars.ALERTAS_DESDE }}
          ENTORNO: produccion
        run: transparencia notificar

  # El Parlamento va aparte: su robots.txt declara Crawl-delay de 3 segundos y
  # recorrer el anillo de decisiones lleva unos 35 minutos. No tiene sentido
  # pagarlo cada media hora para una fuente que produce 0,6 entradas al día,
  # así que se recorre solo en el cierre diario.
  extraer-parlamento:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Solo en el cierre diario, o cuando se pida a propósito. Antes bastaba
    # con lanzar el workflow a mano para que se comiera 50 minutos y 690
    # peticiones al Parlamento, aunque solo se quisiera probar el Gobierno.
    if: >-
      github.event.schedule == '0 21 * * *' ||
      (github.event_name == 'workflow_dispatch' && inputs.parlamento)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Extraer iniciativas del Parlamento
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ENTORNO: produccion
        run: transparencia extraer --fuente parcan
