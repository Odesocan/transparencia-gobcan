# Vocabulario territorial para derivar el campo `territorio`.
#
# La fuente NO publica el territorio como campo. Existen etiquetas de isla, pero
# solo cubren el 4% de las entradas y sin normalizar (conviven "gran canaria" y
# "Gran Canaria" como etiquetas distintas, dentro de una folksonomía de 18.213
# etiquetas libres). Derivarlo del texto funciona mucho mejor: sobre 400 entradas,
# el 47% menciona al menos una isla o municipio.
#
# Por eso el modelo de datos guarda también la PROCEDENCIA del dato: quien
# consulte debe poder distinguir un territorio publicado por la fuente de una
# inferencia nuestra. Nunca presentamos una inferencia como si fuera un dato.
#
# Cotejo: siempre por coincidencia más larga primero. "San Bartolomé de Tirajana"
# antes que "San Bartolomé"; "Santa Cruz de La Palma" antes que "Santa Cruz".

version: 1
fecha_revision: 2026-07-27

# Valor por defecto cuando el texto no menciona ningún ámbito concreto (53% de
# las entradas). No es un hueco: una medida sin territorio explícito es autonómica.
territorio_por_defecto: "Canarias"

# Valor cuando se detectan dos o más islas distintas.
territorio_multiple: "Varias islas"

