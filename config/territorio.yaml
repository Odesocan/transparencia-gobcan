  # La Graciosa es octava isla habitada desde 2018, pero administrativamente
  # pertenece al municipio de Teguise (Lanzarote). Se detecta por su nombre y
  # se resuelve como territorio propio, no como isla con cabildo.
  - clave: la_graciosa
    nombre: "La Graciosa"
    cabildo: null
    pertenece_a: lanzarote
    municipios:
      - Caleta de Sebo

# Términos que indican ámbito autonómico explícito. Tienen prioridad sobre una
# mención aislada de isla: "el Gobierno de Canarias invierte en Tenerife y..."
# sigue siendo una medida canaria si el ámbito declarado es el archipiélago.
ambito_autonomico:
  - "todo el archipiélago"
  - "las ocho islas"
  - "todas las islas"
  - "conjunto de Canarias"
  - "ámbito autonómico"
  - "las islas capitalinas"
