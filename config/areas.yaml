# Vocabulario cerrado de áreas y tabla de correspondencias con las fuentes.
#
# La nomenclatura normalizada es la de las secciones presupuestarias / consejerías,
# la misma que usa la herramienta de cargos políticos (schema `cargos_publicos`,
# tabla `cp_altos_cargos`, campo `area`). No inventamos categorías propias: si una
# consejería cambia de nombre, se añade aquí una entrada con su vigencia y se
# conserva la anterior, de modo que la serie histórica no se parta.
#
# Verificado el 27/07/2026 contra:
#   - cargos_publicos.cp_altos_cargos  (13 valores distintos de `area`)
#   - /noticias/wp-json/wp/v2/categories  (168 categorías del portal de Gobcan)

version: 1
fecha_revision: 2026-07-27

# ---------------------------------------------------------------------------
# Vocabulario normalizado. `clave` es lo que se persiste en la columna `area`.
# ---------------------------------------------------------------------------
areas:
  - clave: sanidad
    nombre: "Consejería de Sanidad"
    tipo: consejeria
  - clave: educacion
    nombre: "Consejería de Educación, Formación Profesional, Actividad Física y Deportes"
    tipo: consejeria
  - clave: universidades
    nombre: "Consejería de Universidades, Ciencia e Innovación y Cultura"
    tipo: consejeria
  - clave: obras_publicas
    nombre: "Consejería de Obras Públicas, Vivienda y Movilidad"
    tipo: consejeria
  - clave: bienestar_social
    nombre: "Consejería de Bienestar Social, Igualdad, Juventud, Infancia y Familias"
    tipo: consejeria
  - clave: presidencia_aapp
    nombre: "Consejería de Presidencia, Administraciones Públicas, Justicia y Seguridad"
    tipo: consejeria
  - clave: transicion_ecologica
    nombre: "Consejería de Transición Ecológica y Energía"
    tipo: consejeria
  - clave: agricultura
    nombre: "Consejería de Agricultura, Ganadería, Pesca y Soberanía Alimentaria"
    tipo: consejeria
  - clave: turismo_empleo
    nombre: "Consejería de Turismo y Empleo"
    tipo: consejeria
  - clave: hacienda
    nombre: "Consejería de Hacienda y Relaciones con la Unión Europea"
    tipo: consejeria
  - clave: economia
    nombre: "Consejería de Economía, Industria, Comercio y Autónomos"
    tipo: consejeria
  - clave: politica_territorial
    nombre: "Consejería de Política Territorial, Cohesión Territorial y Aguas"
    tipo: consejeria
  - clave: presidencia_gobierno
    nombre: "Presidencia del Gobierno"
    tipo: presidencia

  # Entradas que no son consejerías pero necesitan valor propio: sin ellas, el
  # 14% de las entradas útiles quedaría con área nula y sería invisible al filtrar.
  - clave: consejo_gobierno
    nombre: "Consejo de Gobierno"
    tipo: organo
  - clave: entes_instrumentales
    nombre: "Entes instrumentales y organismos adscritos"
    tipo: organo
    nota: "PROEXCA, Servicio de Urgencias Canario, Comisionado del REF y similares."
  - clave: sin_asignar
    nombre: "Sin área asignada en origen"
    tipo: residual
    nota: "Valor explícito, nunca NULL. Su recuento se vigila en la tabla de logs."

