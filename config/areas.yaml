  # cargos_publicos no existe como área propia, y como las consejerías tienen
  # prioridad, cuando aparezcan juntas seguirá ganando la consejería.
  - id: 37
    etiqueta_fuente: "Vicepresidencia"
    area: presidencia_gobierno
