  - {clave: gp_vox,          nombre: "GP VOX",                                      escanos: 4}
  - {clave: gp_asg,          nombre: "GP Agrupación Socialista Gomera (ASG)",       escanos: 3}
  - {clave: gp_mixto,        nombre: "GP Mixto",                                    escanos: 1}
