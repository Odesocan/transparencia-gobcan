<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transparencia Gobcan · ODESOCAN</title>
<meta name="description" content="Buscador de la actividad ejecutiva y parlamentaria de Canarias: publicaciones del Gobierno y del Parlamento de Canarias, filtrables por área, grupo, isla, materia y fecha.">
<meta name="theme-color" content="#0D1B2A">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230D1B2A'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='%2300C8B4' stroke-width='2.6'/%3E%3Ccircle cx='16' cy='16' r='2.6' fill='%2300C8B4'/%3E%3Cpath d='M16 3v5M16 24v5M3 16h5M24 16h5' stroke='%2300C8B4' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="fuentes.css">
<link rel="stylesheet" href="estilos.css">
<script>
/* Se ejecuta antes de pintar nada: si el atributo se pusiera más tarde, la
   página aparecería un instante en claro y saltaría a oscuro. Mientras no se
   pulse el botón manda la preferencia del sistema; después, lo elegido. */
(function(){
  var guardado = null;
  try { guardado = localStorage.getItem("tema-transparencia"); } catch (e) { /* modo privado */ }
  var oscuro = guardado ? guardado === "oscuro"
                        : matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.setAttribute("data-tema", oscuro ? "oscuro" : "claro");
})();
</script>
</head>
<body data-palette="#00C8B4,#7C5CE6">

<!-- React sustituye este contenido en cuanto llegan los datos -->
<div id="app">
  <header class="hero">
    <div class="wrap">
      <div class="label">ODESOCAN · Observatorio de Derechos Sociales de Canarias</div>
      <h1>Actividad <em>ejecutiva y parlamentaria</em> de Canarias</h1>
      <p>Cargando las publicaciones del Gobierno y el Parlamento de Canarias…</p>
    </div>
  </header>
  <div class="cargando" role="status"><i></i>Cargando datos…</div>
  <noscript><div class="wrap"><div class="vacio"><strong>Hace falta JavaScript</strong>
    El buscador filtra los datos en el propio navegador.</div></div></noscript>
</div>

<div id="tooltip" role="status" aria-live="polite"></div>

<!-- Todo se sirve en local, sin CDN: la página funciona sin conexión y abierta
     con doble clic. React va en UMD y la plantilla en htm porque Chrome bloquea
     los módulos ES desde file://. app.js pide datos.js cuando ya hay algo en
     pantalla. -->
<script src="d3.v7.min.js"></script>
<script src="react-18.3.1.min.js"></script>
<script src="react-dom-18.3.1.min.js"></script>
<script src="htm-3.1.1.min.js"></script>
<script src="app.js"></script>
</body>
</html>
